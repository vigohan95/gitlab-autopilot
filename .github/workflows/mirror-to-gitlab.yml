name: Mirror to GitLab
# Optional: pushes every commit on main to a GitLab project that runs the Autopilot pipeline.
# Opt-in. Nothing is pushed unless BOTH the repository variable and the secret for a target are set:
#   GITLAB_MIRROR_URL   + secret GITLAB_TOKEN           (https URL of the .git repository; pushed with ci.skip)
#   GITLAB_SHOWCASE_URL + secret GITLAB_SHOWCASE_TOKEN  (a second project whose pipelines should run)
# Tokens: GitLab project access token, scope write_repository, role Developer or above.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the GitLab mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          MIRROR_URL: ${{ vars.GITLAB_MIRROR_URL }}
        run: |
          if [ -z "$MIRROR_URL" ] || [ -z "$GITLAB_TOKEN" ]; then echo "GITLAB_MIRROR_URL or GITLAB_TOKEN not set; skipping mirror"; exit 0; fi
          TARGET="${MIRROR_URL#https://}"
          git push -o ci.skip "https://oauth2:${GITLAB_TOKEN}@${TARGET}" HEAD:main
      - name: Push to the second GitLab project (showcase), when configured
        env:
          GITLAB_SHOWCASE_TOKEN: ${{ secrets.GITLAB_SHOWCASE_TOKEN }}
          SHOWCASE_URL: ${{ vars.GITLAB_SHOWCASE_URL }}
        run: |
          if [ -z "$SHOWCASE_URL" ] || [ -z "$GITLAB_SHOWCASE_TOKEN" ]; then echo "GITLAB_SHOWCASE_URL or GITLAB_SHOWCASE_TOKEN not set; skipping"; exit 0; fi
          TARGET="${SHOWCASE_URL#https://}"
          git push "https://oauth2:${GITLAB_SHOWCASE_TOKEN}@${TARGET}" HEAD:main

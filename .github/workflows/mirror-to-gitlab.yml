name: Mirror to GitLab
# Pushes every commit on main to the GitLab project that runs the Autopilot pipeline.
# Secrets: GITLAB_TOKEN (GitLab project access token, scope write_repository, role Developer+), optionally
# GITLAB_SHOWCASE_TOKEN for a second project. Repository variables (Settings > Variables) override the targets:
# GITLAB_MIRROR_URL and GITLAB_SHOWCASE_URL (https URLs of the .git repositories). Forks: set your own.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the GitLab mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          MIRROR_URL: ${{ vars.GITLAB_MIRROR_URL || 'https://gitlab.com/hanwg666/gitlab-autopilot.git' }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then echo "GITLAB_TOKEN secret not set; skipping mirror"; exit 0; fi
          TARGET="${MIRROR_URL#https://}"
          git push -o ci.skip "https://oauth2:${GITLAB_TOKEN}@${TARGET}" HEAD:main
          # ci.skip: the history project's Free-tier CI quota is reserved; pipelines run in the showcase project
      - name: Push to the second GitLab project (showcase), when configured
        env:
          GITLAB_SHOWCASE_TOKEN: ${{ secrets.GITLAB_SHOWCASE_TOKEN }}
          SHOWCASE_URL: ${{ vars.GITLAB_SHOWCASE_URL || 'https://gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43190989/showcase.git' }}
        run: |
          if [ -z "$GITLAB_SHOWCASE_TOKEN" ]; then echo "GITLAB_SHOWCASE_TOKEN secret not set; skipping showcase mirror"; exit 0; fi
          TARGET="${SHOWCASE_URL#https://}"
          git push "https://oauth2:${GITLAB_SHOWCASE_TOKEN}@${TARGET}" HEAD:main

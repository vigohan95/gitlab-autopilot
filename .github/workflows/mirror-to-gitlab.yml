name: Mirror to GitLab
# Pushes every commit on main to the GitLab project that runs the Autopilot pipeline.
# Needs one repository secret: GITLAB_TOKEN (GitLab project access token, scope write_repository, role Developer+).
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab (hanwg666/gitlab-autopilot)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then echo "GITLAB_TOKEN secret not set; skipping mirror"; exit 0; fi
          git push -o ci.skip "https://oauth2:${GITLAB_TOKEN}@gitlab.com/hanwg666/gitlab-autopilot.git" HEAD:main
          # history project: ci.skip since 2026-10-10 (Free-tier CI quota exhausted); pipelines run in the showcase project
      - name: Push to the Transcend hackathon showcase project
        env:
          GITLAB_SHOWCASE_TOKEN: ${{ secrets.GITLAB_SHOWCASE_TOKEN }}
        run: |
          if [ -z "$GITLAB_SHOWCASE_TOKEN" ]; then echo "GITLAB_SHOWCASE_TOKEN secret not set; skipping showcase mirror"; exit 0; fi
          git push "https://oauth2:${GITLAB_SHOWCASE_TOKEN}@gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43190989/showcase.git" HEAD:main

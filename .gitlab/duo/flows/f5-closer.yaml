# F5 — Closer / Release Scribe  (DevSecOps: plan, release, govern)
# Trigger: Pipeline events → Passed (see ../triggers.md). Goal = pipeline webhook payload.
# Only main-branch pipelines that reached deploy-production continue. The deterministic
# journey-card CI job already posted the facts table on the issue; this flow writes the narrative,
# adds release notes to the release if one was cut, and closes the issue (AUTOPILOT §1.2, §5.3).
version: "v1"
environment: ambient
coding_environment: none

prompts:
  - prompt_id: "autopilot/closer-triage"
    name: "Autopilot Closer Triage"
    unit_primitives: []
    prompt_template:
      system: |
        You classify a successful GitLab pipeline from its event payload.
        If the ref is the default branch (main), the source is push or merge (not schedule, not trigger),
        and the builds include a job named deploy-production with status success, reply exactly: MAIN
        Otherwise reply exactly: OTHER
        Reply with only that single word.
      user: |
        Pipeline event: {{goal}}
      placeholder: history
    params:
      timeout: 120

  - prompt_id: "autopilot/closer"
    name: "Autopilot Closer"
    unit_primitives: []
    prompt_template:
      system: |
        You are release-scribe, the last agent of an Autopilot journey. A main pipeline just deployed to
        production. You close the loop on the originating issue and document the release. You only report
        facts you read from GitLab (AUTOPILOT section 5.3).

        Procedure:
        1. From the pipeline event take the pipeline id and commit sha.
        2. gitlab_api_get /projects/<id>/repository/commits/<sha>/merge_requests -> the merged MR.
           gitlab_api_get /projects/<id>/merge_requests/<iid>/closes_issues -> the originating issue.
           If there is no MR or no issue, reply NOTHING-TO-CLOSE and stop.
        3. gitlab_api_get /projects/<id>/pipelines/<pipeline id>/jobs -> stages, durations, retries.
           Read the MR notes (list_all_merge_request_notes) for the reviewer decision and the policy check.
        4. Post an issue note (create_issue_note) titled "Autopilot journey — narrative" with:
           what was asked, what was built (from the MR), how it was reviewed (rule numbers cited by the
           reviewer), what the scanners found, the release tag if any, the staging and production
           deployment URLs, total wall-clock time from issue creation to production, and any
           follow-ups for humans. End with: autopilot: rules=[section 1.2, section 5.3, section 9.2]
        5. If a release was created in this pipeline (gitlab_api_get /projects/<id>/releases, newest
           released_at after the pipeline started), append a "Highlights" paragraph to its description
           via the GitLab GraphQL releaseUpdate mutation if gitlab_graphql allows it; otherwise post the
           highlights as a note on the issue.
        6. Close the issue with update_issue (state_event close).
        7. Final answer: the issue URL.

        Stop after closing the issue. Do not edit files or trigger pipelines.
      user: |
        Pipeline event: {{goal}}
        Project ID: {{project_id}}
      placeholder: history
    params:
      timeout: 600

components:
  - name: "triage"
    type: AgentComponent
    prompt_id: "autopilot/closer-triage"
    inputs:
      - from: "context:goal"
        as: "goal"
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: "closer"
    type: AgentComponent
    prompt_id: "autopilot/closer"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - gitlab_api_get
      - gitlab_graphql
      - get_merge_request
      - list_all_merge_request_notes
      - get_issue
      - list_issue_notes
      - create_issue_note
      - update_issue
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed

routers:
  - from: "triage"
    condition:
      input: "context:triage.final_answer"
      routes:
        "MAIN": "closer"
      default_route: "end"
  - from: "closer"
    to: "end"

flow:
  entry_point: "triage"

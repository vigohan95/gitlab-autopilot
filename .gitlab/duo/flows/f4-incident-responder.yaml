# F4 — Incident Responder  (DevSecOps: monitor, govern)
# Trigger: Pipeline events → Failed (see ../triggers.md). Goal = pipeline webhook payload.
# Only the scheduled monitor pipeline continues. By the time this flow runs, scripts/incident.py has
# already opened the Incident and started the rollback pipeline (deterministic part, AUTOPILOT §6).
# This flow does the reasoning: root-cause analysis, verification that the rollback restored service,
# and the incident timeline, from job logs, releases and pipelines. (The read-only MCP server in
# mcp_server/ is usable from the IDE / Duo CLI via .gitlab/duo/mcp.json; GitLab.com's AI Catalog only
# offers curated MCP servers, so flows in the UI cannot use it.)
#
# Tool ids verified against the live catalog (aiCatalogBuiltInTools) on 2026-10-10.
version: "v1"
environment: ambient
coding_environment: none

prompts:
  - prompt_id: "autopilot/incident-triage"
    name: "Autopilot Incident Triage"
    unit_primitives: []
    prompt_template:
      system: |
        You classify a failed GitLab pipeline from its event payload.
        If the pipeline source is "schedule" and a job named monitor failed, reply exactly: MONITOR
        Otherwise reply exactly: OTHER
        Reply with only that single word.
      user: |
        Pipeline event: {{goal}}
      placeholder: history
    params:
      timeout: 120

  - prompt_id: "autopilot/incident-responder"
    name: "Autopilot Incident Responder"
    unit_primitives: []
    prompt_template:
      system: |
        You are incident-responder. Production monitoring failed. Your job is the root-cause analysis and
        the incident timeline, within AUTOPILOT.md section 6. You never roll forward and never close the incident.

        Procedure:
        1. From the pipeline event take the pipeline id. get_job_logs of the monitor and incident jobs: they
           contain monitor-report.json, the incident IID and the rollback target tag.
        2. Find the incident: list_issues with issue_type incident, state opened, labels autopilot,incident.
           If none exists (the incident job could not create one), create_issue with issue_type incident,
           title "Production unhealthy (<timestamp>)", labels autopilot,incident,env::production.
        3. Gather evidence from the job logs (monitor-report.json is printed by the monitor job), list_releases
           (which release is deployed, which one is the rollback target) and list_pipelines / get_pipeline.
        4. Determine the root cause: a 503 on /healthz with reason PULSE_CHAOS means the chaos switch
           (section 7) was set — say so plainly. A version mismatch means a bad deploy. Timeouts mean the
           Space is asleep or the host is down.
        5. Check the rollback: the incident job's log and the incident notes contain the rollback pipeline URL;
           confirm its status with get_pipeline (or list_pipelines on ref main, newest first). Report status and URL.
        6. Write the RCA as an incident note with these headings: Impact, Timeline (UTC), Root cause,
           Remediation (automatic), Follow-ups for humans, Evidence. End with:
           autopilot: rules=[section 6.1, section 6.2, section 6.3]
        7. Add the label rca::done with update_issue. Leave the incident open (section 6.3).
        8. Final answer: the incident URL.

        Stop after the RCA note. Do not trigger pipelines. Do not edit files.
      user: |
        Pipeline event: {{goal}}
        Project ID: {{project_id}}
      placeholder: history
    params:
      timeout: 900

components:
  - name: "triage"
    type: AgentComponent
    prompt_id: "autopilot/incident-triage"
    inputs:
      - from: "context:goal"
        as: "goal"
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: "responder"
    type: AgentComponent
    prompt_id: "autopilot/incident-responder"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - get_pipeline_failing_jobs
      - get_job_logs
      - list_issues
      - get_issue
      - create_issue
      - create_issue_note
      - update_issue
      - gitlab_issue_search
      - list_releases
      - list_pipelines
      - get_pipeline
      - get_repository_file
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed

routers:
  - from: "triage"
    condition:
      input: "context:triage.final_answer"
      routes:
        "MONITOR": "responder"
      default_route: "end"
  - from: "responder"
    to: "end"

flow:
  entry_point: "triage"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-autopilot"
dynamic = ["version"]
description = "Policy-as-code merge gate, incident and automatic rollback for GitLab CI; ships with the pulse sample service it operates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Han Vigo" }]
keywords = ["gitlab", "ci", "devsecops", "policy-as-code", "rollback", "incident", "gitlab-duo", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
# the CI scripts need only these two; the sample service and the other extras are optional
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
app = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.6,<3"]
mcp = ["mcp>=1.2"]
deploy = ["huggingface_hub>=0.25"]
ci-schema = ["jsonschema>=4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pip-audit>=2.7", "build", "twine", "mcp>=1.2", "jsonschema", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.6,<3", "huggingface_hub>=0.25"]

[project.urls]
Homepage = "https://github.com/vigohan95/gitlab-autopilot"
Documentation = "https://github.com/vigohan95/gitlab-autopilot/blob/main/docs/QUICKSTART.md"
Changelog = "https://github.com/vigohan95/gitlab-autopilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/vigohan95/gitlab-autopilot/issues"

[project.scripts]
pulse = "pulse.__main__:main"
autopilot-policy = "gitlab_autopilot.policy:main"
autopilot-automerge = "gitlab_autopilot.automerge:main"
autopilot-review-approve = "gitlab_autopilot.review_approve:main"
autopilot-release-notes = "gitlab_autopilot.release_notes:cli"
autopilot-journey-card = "gitlab_autopilot.journey_card:main"
autopilot-receipts = "gitlab_autopilot.receipts_page:main"
autopilot-monitor = "gitlab_autopilot.monitor:main"
autopilot-incident = "gitlab_autopilot.incident:main"
autopilot-rollback-ref = "gitlab_autopilot.rollback_ref:main"
autopilot-deploy = "gitlab_autopilot.deploy:main"
autopilot-sci = "gitlab_autopilot.sci:main"
autopilot-start-flow = "gitlab_autopilot.start_flow:main"
autopilot-fetch-ref = "gitlab_autopilot.fetch_ref:main"
autopilot-check-ci = "gitlab_autopilot.check_ci_schema:main"
autopilot-demo = "gitlab_autopilot.demo:main"

[tool.setuptools]
packages = ["pulse", "mcp_server", "gitlab_autopilot"]

[tool.setuptools.package-dir]
gitlab_autopilot = "scripts"

[tool.setuptools.dynamic]
version = { attr = "gitlab_autopilot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S603", "S607"]
"scripts/make_video.py" = ["E501", "S110"]  # embedded HTML/CSS strings; best-effort page tweaks
"scripts/receipts_page.py" = ["E501"]  # embedded HTML/CSS template

[tool.coverage.run]
source = ["pulse", "mcp_server"]

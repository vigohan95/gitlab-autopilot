[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-monitor"
dynamic = ["version"]
description = "Tiny site-health probe service, operated end-to-end by GitLab Duo Agent Platform (Autopilot)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Han Vigo" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pip-audit>=2.7", "build", "twine", "mcp>=1.2", "pyyaml", "jsonschema"]
mcp = ["mcp>=1.2"]
deploy = ["huggingface_hub>=0.25"]

[project.scripts]
pulse = "pulse.__main__:main"

[tool.setuptools]
packages = ["pulse", "mcp_server"]

[tool.setuptools.dynamic]
version = { attr = "pulse.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S603", "S607"]
"scripts/make_video.py" = ["E501", "S110"]  # embedded HTML/CSS strings; best-effort page tweaks
"scripts/receipts_page.py" = ["E501"]  # embedded HTML/CSS template

[tool.coverage.run]
source = ["pulse", "mcp_server"]

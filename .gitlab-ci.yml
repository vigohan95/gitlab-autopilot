# Autopilot pipeline for pulse — every DevSecOps lifecycle stage is a real job.
#
#   plan      issue + Planner flow (outside CI)            govern    policy-check, auto-merge, audit-trail, journey-card
#   create    Developer flow opens the MR (outside CI)     verify    test, lint, verify-staging
#   secure    SAST, Secret Detection, Dependency Scanning, pip-audit, Container Scanning
#   package   build-image (Container Registry), build-wheel (Package Registry)
#   release   release-cli tag + notes                      configure deploy-staging, deploy-production, rollback
#   monitor   scheduled monitor -> incident -> rollback
#
# Policy: AUTOPILOT.md. Flows/agents: .gitlab/duo/. Nothing here costs money: GitLab hosted
# runners (free minutes) + Render free web services.

stages:
  - test
  - quality
  - secure
  - build
  - package
  - release
  - deploy-staging
  - verify-staging
  - deploy-production
  - monitor
  - govern
  - demo

# Security scanners run on merge request and main pipelines only. The scheduled monitor and rollback pipelines
# change no code, so a scan there produces nothing new (the 2026-10-14 drill's scheduled pipeline 2945603793 ran
# gemnasium-python-dependency_scanning for 54 s; docs/SCI.md §4). Two layers:
#   1. these workflow variables switch off EVERY analyzer of the four templates (each template job's first rule
#      is `$<SCANNER>_DISABLED == 'true'` -> never), including ones that do not match this repository today;
#   2. the template jobs that do match it (semgrep-sast, secret_detection, gemnasium-python-dependency_scanning,
#      container_scanning) also have explicit rules below. tests/test_ci_rules.py evaluates both.
.no_scanners: &no_scanners
  SAST_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # scheduled pipelines run on main too, so this must come before the main rule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables: *no_scanners
    # a hand-started rollback with the ROLLBACK_TO variable (Maintainer role) on main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ROLLBACK_TO
      variables: *no_scanners
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # rollback pipelines (scripts/incident.py, scripts/rollback_ref.py): only the explicit start, never the
    # push pipeline that creating the branch may cause
    - if: $CI_COMMIT_BRANCH =~ /^rollback\/v[0-9]/ && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^rollback\/v[0-9]/
      variables: *no_scanners
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  PYTHON_IMAGE: "python:3.12-slim"
  PYTHONUNBUFFERED: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE: "$CI_REGISTRY_IMAGE"
  # security templates
  SAST_EXCLUDED_PATHS: "tests, docs, .gitlab"
  SECRET_DETECTION_HISTORIC_SCAN: "false"
  DS_EXCLUDED_PATHS: "tests, docs"
  CS_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  CS_DOCKERFILE_PATH: "Dockerfile"
  # deployment targets — set as CI/CD variables in the project (see README "Reproduce")
  PULSE_STAGING_URL: ""
  PULSE_PRODUCTION_URL: ""
  HF_STAGING_SPACE: ""
  HF_PRODUCTION_SPACE: ""
  # Rollback pipelines run on the branch rollback/<tag>/incident-<iid> that scripts/incident.py creates; the
  # tag and the incident come from the branch name (scripts/rollback_ref.py), so no pipeline variables are
  # needed (the judged project refuses them below Maintainer). A ROLLBACK_TO variable set by hand still works.
  ROLLBACK_TO: ""
  INCIDENT_IID: ""

default:
  image: $PYTHON_IMAGE
  interruptible: true

# ---------------------------------------------------------------- rule sets --
.rules_app: &rules_app
  - if: $ROLLBACK_TO
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules_main: &rules_main
  - if: $ROLLBACK_TO
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules_deploy: &rules_deploy
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $ROLLBACK_TO
  - if: $CI_COMMIT_BRANCH =~ /^rollback\/v[0-9]/
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules_mr: &rules_mr
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.python:
  before_script:
    - python --version
    - pip install --quiet --disable-pip-version-check -r requirements-dev.txt
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip

# ======================================================================= verify
version:
  stage: .pre
  extends: .python
  script:
    - python scripts/release_notes.py
  artifacts:
    reports:
      dotenv: version.env
    paths:
      - RELEASE_NOTES.md
    expire_in: 1 week
  rules: *rules_app

test:
  stage: test
  extends: .python
  script:
    - python -m pytest -q --junitxml=junit.xml --cov --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules: *rules_app

lint:
  stage: quality
  extends: .python
  script:
    - ruff format --check .
    - ruff check --output-format json . > ruff.json || true
    - python scripts/codequality.py ruff.json > codequality.json
    - ruff check .
  artifacts:
    when: always
    reports:
      codequality: codequality.json
    expire_in: 1 week
  rules: *rules_app

# Hands-off hand-off: a merge request opened by the Developer flow's service account does not
# fire the "Merge request: Created" trigger (triggers need a human actor; seen on MR !1). This job
# starts the Code Review foundational flow AND our F2 Reviewer flow (policy review) through the API.
# F2 is an AI Catalog flow, so it is addressed by its consumer id (CI variable AUTOPILOT_F2_CONSUMER_ID,
# see scripts/start_flow.py). Advisory only: the CI gate enforces AUTOPILOT §3 regardless.
review-handoff:
  stage: quality
  extends: .python
  script:
    - python scripts/start_flow.py --definition code_review/v1 --goal "$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
    - |
      if [ -n "$AUTOPILOT_F2_CONSUMER_ID" ]; then
        MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
        python scripts/start_flow.py --consumer-id "$AUTOPILOT_F2_CONSUMER_ID" --merge-request "$CI_MERGE_REQUEST_IID" --goal "Review merge request !$CI_MERGE_REQUEST_IID ($MR_URL) against AUTOPILOT.md"
      else
        echo "AUTOPILOT_F2_CONSUMER_ID not set: F2 reviewer not started from CI (see scripts/start_flow.py); policy-check is the reviewer of record (AUTOPILOT §3.2)"
      fi
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)autopilot(,|$)/

# ======================================================================= secure
# Template jobs are moved into the `secure` stage (SAST and Secret Detection are available
# on Free; Dependency Scanning and Container Scanning need Ultimate and skip themselves otherwise).
sast:
  stage: secure

# The templates run their analyzers on every branch pipeline (`$CI_COMMIT_BRANCH && …`), including the
# scheduled monitor and rollback/<tag>/… pipelines, where nothing changed: ~31 s (semgrep) and ~54 s (gemnasium)
# of runner time per run for no new information (docs/SCI.md §4). MR and main pipelines only.
semgrep-sast:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

secret_detection:
  stage: secure
  needs: []
  rules: *rules_app

dependency_scanning:
  stage: secure

# Same conditions as the template (Ultimate feature, a Python manifest in the repository, the global switch),
# restricted to MR and main pipelines. The template ran it on scheduled pipeline 2945603793 (drill 2026-10-14).
gemnasium-python-dependency_scanning:
  rules:
    - if: $DEPENDENCY_SCANNING_DISABLED == 'true' || $DEPENDENCY_SCANNING_DISABLED == '1'
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_FEATURES =~ /\bdependency_scanning\b/
      exists:
        - "**/{requirements.txt,requirements.pip,Pipfile,Pipfile.lock,requires.txt,setup.py,poetry.lock,uv.lock}"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_FEATURES =~ /\bdependency_scanning\b/
      exists:
        - "**/{requirements.txt,requirements.pip,Pipfile,Pipfile.lock,requires.txt,setup.py,poetry.lock,uv.lock}"

pip-audit:
  stage: secure
  extends: .python
  needs: []
  script:
    - pip-audit -r requirements.txt --strict --desc on -f json -o pip-audit.json || AUDIT_RC=$?
    - pip-audit -r requirements.txt --strict --desc on || true
    - test -z "$AUDIT_RC"
  artifacts:
    when: always
    paths:
      - pip-audit.json
    expire_in: 1 week
  rules: *rules_app

# ====================================================================== package
build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg "PULSE_VERSION=${VERSION:-$CI_COMMIT_SHORT_SHA}" -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:latest" && docker push "$IMAGE:latest"
        if [ -n "$VERSION" ]; then docker tag "$IMAGE:$CI_COMMIT_SHA" "$IMAGE:v$VERSION" && docker push "$IMAGE:v$VERSION"; fi
      fi
  rules: *rules_app

container_scanning:
  stage: package
  needs: [build-image]
  rules: *rules_app

build-wheel:
  stage: package
  extends: .python
  script:
    - python -m build
    - ls -la dist/
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ "$RELEASE_NEEDED" = "true" ]; then
        TWINE_PASSWORD="$CI_JOB_TOKEN" TWINE_USERNAME=gitlab-ci-token \
          python -m twine upload --non-interactive \
            --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/* \
          || python scripts/package_exists.py "$VERSION"
      else
        echo "not a release build (RELEASE_NEEDED=$RELEASE_NEEDED); wheel kept as artifact only"
      fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules: *rules_app

# ====================================================================== release
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [version, build-image, build-wheel]
  script:
    - |
      if [ "$RELEASE_NEEDED" != "true" ]; then
        echo "tag $RELEASE_TAG already exists; no new release (AUTOPILOT §5.1)"; exit 0
      fi
      release-cli create \
        --name "pulse $RELEASE_TAG" \
        --tag-name "$RELEASE_TAG" \
        --ref "$CI_COMMIT_SHA" \
        --description "$(cat RELEASE_NOTES.md)" \
        --assets-link "{\"name\":\"container image $IMAGE:$RELEASE_TAG\",\"url\":\"$CI_PROJECT_URL/container_registry\",\"link_type\":\"image\"}" \
        --assets-link "{\"name\":\"python wheel (Package Registry)\",\"url\":\"$CI_PROJECT_URL/-/packages\",\"link_type\":\"package\"}"
  rules: *rules_main

# ==================================================================== configure
# Provider is chosen by scripts/deploy.py: Render (RENDER_API_KEY, free web services, deploy by commit),
# else Hugging Face (HF_TOKEN; Docker Spaces are paid now -> degrades to dry run), else dry run.
.deploy:
  extends: .python
  before_script:
    - pip install --quiet --disable-pip-version-check -r requirements-dev.txt
    - eval "$(python scripts/rollback_ref.py)"   # on rollback/<tag>/incident-<iid>: exports ROLLBACK_TO, INCIDENT_IID
    - |
      if [ -n "$ROLLBACK_TO" ]; then
        echo "ROLLBACK to $ROLLBACK_TO (AUTOPILOT §6.2)"
        export DEPLOY_VERSION="${ROLLBACK_TO#v}"
      else
        export DEPLOY_VERSION="${VERSION:-$CI_COMMIT_SHORT_SHA}"
      fi
      echo "DEPLOY_VERSION=$DEPLOY_VERSION"

deploy-staging:
  stage: deploy-staging
  extends: .deploy
  script:
    - python scripts/deploy.py --env staging --version "$DEPLOY_VERSION"
  environment:
    name: staging
    url: $PULSE_STAGING_URL
    deployment_tier: staging
  artifacts:
    reports:
      dotenv: deploy.env
  resource_group: staging
  rules: *rules_deploy

verify-staging:
  stage: verify-staging
  extends: .python
  script:
    - |
      if [ "$DEPLOY_MODE" != "live" ]; then echo "skipped: staging was not deployed (DEPLOY_MODE=${DEPLOY_MODE:-unset})"; exit 0; fi
      URL="${DEPLOY_URL:-$PULSE_STAGING_URL}"
      if [ -z "$URL" ]; then echo "skipped: no staging URL"; exit 0; fi
      python scripts/monitor.py --target "staging=$URL" --expect-version "$DEPLOY_VERSION" --any-env --retries 5 --backoff 20 --report staging-report.json
  artifacts:
    when: always
    paths:
      - staging-report.json
    expire_in: 1 week
  rules: *rules_deploy

deploy-production:
  stage: deploy-production
  extends: .deploy
  needs:
    - job: version
      optional: true
    - deploy-staging
    - verify-staging
  script:
    - python scripts/deploy.py --env production --version "$DEPLOY_VERSION"
  environment:
    name: production
    url: $PULSE_PRODUCTION_URL
    deployment_tier: production
  artifacts:
    reports:
      dotenv: deploy.env
  resource_group: production
  rules: *rules_deploy

# ====================================================================== monitor
monitor:
  stage: monitor
  extends: .python
  script:
    - |
      ARGS=""
      [ -n "$PULSE_STAGING_URL" ] && ARGS="$ARGS --target staging=$PULSE_STAGING_URL"
      [ -n "$PULSE_PRODUCTION_URL" ] && ARGS="$ARGS --target production=$PULSE_PRODUCTION_URL"
      python scripts/monitor.py $ARGS --retries 5 --backoff 20
  artifacts:
    when: always
    paths:
      - monitor-report.json
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Opens the GitLab Incident and starts the rollback pipeline when the monitor is red.
# The Incident Responder flow (.gitlab/duo/flows/f4-incident-responder.yaml) is started by the
# "Pipeline: Failed" trigger and writes the RCA into the incident.
incident:
  stage: monitor
  extends: .python
  needs:
    - job: monitor
      artifacts: true
  when: on_failure
  script:
    - python scripts/incident.py
  artifacts:
    when: always
    reports:
      dotenv: incident.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ======================================================================= govern
policy-check:
  stage: govern
  extends: .python
  script:
    - python scripts/policy.py --mr "$CI_MERGE_REQUEST_IID" --comment
  rules: *rules_mr

# §3.2 as a real approval: reads F2's "Autopilot review: APPROVED" note and approves the MR with the CI
# token on that verdict (scripts/review_approve.py says so in its note). Waits for the verdict only when
# F2 could have been started (consumer id set); otherwise exits at once and auto-merge uses the label.
review-approve:
  stage: govern
  extends: .python
  needs: [policy-check]
  script:
    - if [ -n "$AUTOPILOT_F2_CONSUMER_ID" ]; then WAIT=600; else WAIT=0; fi
    - python scripts/review_approve.py --mr "$CI_MERGE_REQUEST_IID" --wait "$WAIT" --interval 30
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)autopilot(,|$)/

auto-merge:
  stage: govern
  extends: .python
  needs:
    - policy-check
    - review-approve
    - test
    - lint
    - pip-audit
    - build-image
  script:
    - python scripts/automerge.py --mr "$CI_MERGE_REQUEST_IID"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)autopilot(,|$)/

journey-card:
  stage: govern
  extends: .python
  needs: [deploy-production]
  script:
    - python scripts/sci.py --pipeline "$CI_PIPELINE_ID" --out sci.json   # CI footprint estimate (docs/SCI.md)
    - python scripts/journey_card.py --close
  artifacts:
    paths:
      - journey-card.md
      - sci.json
    expire_in: 1 month
  rules: *rules_main

# Login-free receipts page on GitLab Pages (Deploy > Pages for the URL): every autopilot journey with its
# lead time, human-touch count and CI footprint, read from the project's own issues/MRs/notes. scripts/receipts_page.py
pages:
  stage: govern
  extends: .python
  needs: [journey-card]
  script:
    - python scripts/receipts_page.py --out public
  artifacts:
    paths:
      - public
    expire_in: 1 month
  rules: *rules_main

rollback-note:
  stage: govern
  extends: .python
  needs: [deploy-production]
  script:
    - |
      python - <<'PY'
      import os, sys
      sys.path.insert(0, "scripts")
      from gitlab_api import GitLab
      from rollback_ref import current
      gl = GitLab(); tag, iid = current()   # explicit variables, else the rollback/<tag>/incident-<iid> branch
      if iid and gl.can_write:
          gl.issue_note(int(iid), f"Rollback to `{tag}` deployed to staging and production: {os.environ['CI_PIPELINE_URL']}\n\nautopilot: rules=[§5.2, §6.2]")
          print("incident updated")
      else:
          print("no incident to update")
      PY
  rules:
    - if: $ROLLBACK_TO
    - if: $CI_COMMIT_BRANCH =~ /^rollback\/v[0-9]/

audit-trail:
  stage: govern
  extends: .python
  when: always
  script:
    - |
      python - <<'PY'
      import json, os
      keys = ["CI_PIPELINE_ID","CI_PIPELINE_SOURCE","CI_COMMIT_SHA","CI_COMMIT_REF_NAME","CI_MERGE_REQUEST_IID",
              "CI_MERGE_REQUEST_LABELS","GITLAB_USER_LOGIN","ROLLBACK_TO","INCIDENT_IID","VERSION","RELEASE_NEEDED"]
      os.makedirs("audit", exist_ok=True)
      json.dump({k: os.environ.get(k, "") for k in keys}, open("audit/pipeline.json", "w"), indent=2)
      print(open("audit/pipeline.json").read())
      PY
  artifacts:
    paths:
      - audit/
    expire_in: 1 year
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # the monitor's own report artifact is its audit record
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $ROLLBACK_TO
    - if: $CI_COMMIT_BRANCH =~ /^rollback\/v[0-9]/

# ========================================================================= demo
# Manual jobs that drive the demo scenes through the API with AUTOPILOT_TOKEN (see DEMO.md).
# They never block the pipeline and skip themselves when the token is absent.
.demo:
  stage: demo
  extends: .python
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

demo:setup:
  extends: .demo
  script:
    - python scripts/demo.py setup

demo:mr:
  extends: .demo
  script:
    - python scripts/demo.py mr

demo:security:
  extends: .demo
  script:
    - python scripts/demo.py security

demo:security-fix:
  extends: .demo
  script:
    - python scripts/demo.py security --fix

demo:chaos-on:
  extends: .demo
  script:
    - |
      if [ -n "$PULSE_PRODUCTION_URL" ] && [ -z "$DEMO_FAKE_URL" ]; then
        python scripts/demo.py chaos on
      else
        python scripts/demo.py chaos on --fake-url ${DEMO_FAKE_URL:-https://pulse-chaos.invalid}
      fi

demo:chaos-off:
  extends: .demo
  script:
    - python scripts/demo.py chaos off ${DEMO_FAKE_URL:+--fake-url}

demo:cleanup:
  extends: .demo
  script:
    - python scripts/demo.py cleanup

# Repost an honest journey card on issue #1 (the first card, posted before journey_card.py reported real actors,
# credited Duo flows that had not run). Reads the real jobs of the main pipeline that shipped MR !1.
demo:recard:
  extends: .demo
  variables:
    RECARD_PIPELINE: "2930758376"
    RECARD_SHA: "a17bf11d72ed48d0a7a4be1cb4088e99110bb0a1"
  script:
    - python scripts/journey_card.py --pipeline "$RECARD_PIPELINE" --sha "$RECARD_SHA" --supersede
